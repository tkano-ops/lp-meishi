<svg width="600" height="700" viewBox="0 0 600 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ヒトイロのICカードとスマートフォンのモックアップ">
  <defs>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560" />
      <stop offset="25%" stop-color="#f0a500" />
      <stop offset="50%" stop-color="#2ec4b6" />
      <stop offset="75%" stop-color="#3a86ff" />
      <stop offset="100%" stop-color="#8338ec" />
    </linearGradient>
    <linearGradient id="spectrumSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#f0a500" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#2ec4b6" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#3a86ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8338ec" stop-opacity="0.85" />
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="phoneShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- IC card -->
  <g transform="translate(70,360) rotate(-9)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="380" height="236" rx="20" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1.5" />
    <!-- NFC contactless icon -->
    <g transform="translate(324,36)" stroke="url(#spectrum)" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M0 18 A18 18 0 0 1 18 0" opacity="0.9" />
      <path d="M-8 26 A28 28 0 0 1 26 -8" opacity="0.6" />
      <path d="M-16 34 A38 38 0 0 1 34 -16" opacity="0.35" />
    </g>
    <!-- wordmark -->
    <text x="32" y="56" font-family="'Hiragino Mincho ProN','Noto Serif JP',serif" font-size="15" letter-spacing="4" fill="#f2f0ec" opacity="0.55">HITOIRO CARD</text>
    <!-- ヒトイロ in spectrum gradient -->
    <text x="30" y="150" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-weight="700" font-size="64" letter-spacing="6" fill="url(#spectrum)">ヒトイロ</text>
    <text x="32" y="196" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="13" letter-spacing="3" fill="#f2f0ec" opacity="0.45">TAMAKI YUSUKE</text>
    <!-- chip -->
    <rect x="30" y="90" width="40" height="30" rx="6" fill="#f0a500" opacity="0.85" />
  </g>

  <!-- Smartphone -->
  <g transform="translate(210,40) rotate(7)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="270" height="560" rx="42" fill="#1c1c1c" stroke="#3a3a3a" stroke-width="2" />
    <rect x="10" y="10" width="250" height="540" rx="34" fill="#0f0f0f" />
    <!-- notch -->
    <rect x="100" y="18" width="70" height="18" rx="9" fill="#000000" />

    <!-- screen content -->
    <g transform="translate(24,60)">
      <!-- status labels -->
      <text x="0" y="0" font-family="'Helvetica Neue',Arial,sans-serif" font-size="9" letter-spacing="2" fill="#8a8a8a">HITOIRO — ISSUE 01</text>

      <!-- hero gradient block -->
      <rect x="0" y="16" width="222" height="150" rx="16" fill="url(#spectrumSoft)" />
      <rect x="0" y="16" width="222" height="150" rx="16" fill="#0a0a0a" opacity="0.25" />
      <text x="16" y="70" font-family="'Hiragino Mincho ProN','Noto Serif JP',serif" font-size="22" fill="#fafaf7">人と人を</text>
      <text x="16" y="100" font-family="'Hiragino Mincho ProN','Noto Serif JP',serif" font-size="22" fill="#fafaf7">つなぐ、</text>

      <!-- profile row -->
      <circle cx="26" cy="196" r="18" fill="#2a2a2a" />
      <circle cx="26" cy="196" r="18" fill="none" stroke="url(#spectrum)" stroke-width="2" />
      <rect x="54" y="186" width="120" height="8" rx="4" fill="#e8e8e4" opacity="0.85" />
      <rect x="54" y="200" width="80" height="6" rx="3" fill="#8a8a8a" />

      <!-- text lines -->
      <rect x="0" y="238" width="222" height="6" rx="3" fill="#3a3a3a" />
      <rect x="0" y="254" width="190" height="6" rx="3" fill="#3a3a3a" />
      <rect x="0" y="270" width="205" height="6" rx="3" fill="#3a3a3a" />

      <!-- CTA button -->
      <rect x="41" y="304" width="140" height="40" rx="20" fill="#3a86ff" />
      <text x="111" y="329" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="13" fill="#fafaf7">プロフィールを見る</text>
    </g>
  </g>
</svg>
